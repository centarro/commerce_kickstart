name: Commerce Kickstart
type: profile
core_version_requirement: ^11
version: VERSION
description: 'The fastest way to start building on Drupal Commerce.'
distribution:
  name: 'Commerce Kickstart'
  install:
    theme: kickstart_installer

# A list of forms that should be presented to the user before choosing database
# settings and installing the system. Each of these forms must implement
# \Drupal\RecipeKit\Installer\FormInterface.
forms:
  - '\Centarro\InstallerHelper\Form\SiteNameForm'
  - '\Centarro\InstallerHelper\Form\RecipesForm'

recipes:
  # This should be a list of recipes' Composer package names that should always be
  # applied during the install process.
  required:
    - drupal/commerce_kickstart_base

hide_messages:
  - 'All necessary changes to %dir and %file have been made, so you should remove write permissions to them now in order to avoid security risks. If you are unsure how to do so, consult the <a href=":handbook_url">online handbook</a>.'
